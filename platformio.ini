[env:lolin_s2_mini]
platform = espressif32 @ 6.3.2
board = lolin_s2_mini
framework = arduino

build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=1

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DUSE_TINYUSB
    -DCONFIG_TINYUSB_TASK_STACK_SIZE=4096

lib_deps =
    https://github.com/pschatzmann/arduino-audio-tools.git#v0.9.7
    
