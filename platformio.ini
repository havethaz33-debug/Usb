[env:lolin_s2_mini]
; USBAudioStream di ESP32 butuh arduino-esp32 versi master (ada USB_INTERFACE_AUDIO).
; Platform lama espressif32@6.3.2 (Arduino core 2.0.9) tidak punya itu.
platform = https://github.com/pioarduino/platform-espressif32.git#develop
board = lolin_s2_mini
framework = arduino

build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=1

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0

lib_deps =
    https://github.com/pschatzmann/arduino-audio-tools.git
