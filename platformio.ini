; "stable" adalah alias yang bergerak (README pioarduino: sekarang Arduino-ESP32 3.3.5).
; Kalau crash sudah beres, ganti "stable" dengan tag rilis dari
; https://github.com/pioarduino/platform-espressif32/releases supaya build tidak berubah sendiri.
;
; AudioTools di-pin ke rilis v1.2.5 (rilis pertama dengan USB Audio). Sebelumnya tanpa tag,
; artinya ikut branch main yang terus berubah. Kalau compile error karena ada field yang
; hanya ada di main, ganti "#v1.2.5" dengan "#<hash commit>" dari build yang dulu jalan.
;
; OLED: U8g2 (SSD1306/SH1106 via I2C). "^2.34.22" = versi 2.x terbaru yang kompatibel (nomor terbaru tidak sempat saya pastikan).

[env:lolin_s2_mini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = lolin_s2_mini
framework = arduino
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
lib_deps =
    https://github.com/pschatzmann/arduino-audio-tools.git#v1.2.5
    olikraus/U8g2@^2.34.22
