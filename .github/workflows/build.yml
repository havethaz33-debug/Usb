name: Build firmware
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install platformio
      - run: pio run
      - name: Gabung jadi satu bin
        run: |
          pip install esptool
          B=.pio/build/lolin_s2_mini
          BOOT=$(find ~/.platformio -name boot_app0.bin | head -n 1)
          python -m esptool --chip esp32s2 merge_bin -o $B/merged.bin \
            --flash_mode dio --flash_size 4MB \
            0x1000 $B/bootloader.bin \
            0x8000 $B/partitions.bin \
            0xe000 $BOOT \
            0x10000 $B/firmware.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/lolin_s2_mini/merged.bin
